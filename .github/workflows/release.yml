name: release

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload to
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: webpad-linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: webpad-linux-aarch64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: webpad-windows-x86_64.exe }
          - { os: macos-latest, target: aarch64-apple-darwin, name: webpad-macos-aarch64 }
          - { os: macos-latest, target: x86_64-apple-darwin, name: webpad-macos-x86_64 }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: oven-sh/setup-bun@v2
      - name: Build client into server/dist
        working-directory: client
        run: bun install --frozen-lockfile && bun run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build server
        working-directory: server
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp "server/target/${{ matrix.target }}/release/webpad$ext" "${{ matrix.name }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes || true
          gh release upload "$TAG" "${{ matrix.name }}" --clobber
