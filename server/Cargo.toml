[package]
name = "webpad"
version = "2.1.1"
edition = "2021"

[dependencies]
enigo = { version = "0.3.0", default-features = false, features = ["x11rb"] }
tungstenite = "0.24.0"
tiny_http = "0.12"
include_dir = "0.7.3"
qrcode = { version = "0.14.1", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
